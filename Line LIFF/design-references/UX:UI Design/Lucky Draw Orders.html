<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lucky Draw — My Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Sans+JP:wght@400;500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lucky-draw-shared.css">
<style>
body { padding-bottom: 80px; }

.filter-bar { display:flex; gap:6px; overflow-x:auto; padding:10px 14px 0; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.filter-chip { flex-shrink:0; padding:6px 14px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border2); background:transparent; color:var(--muted); font-family:var(--font-b); transition:all .2s; }
.filter-chip.active { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }

.order-card { background:var(--bg2); border:1px solid var(--border2); border-radius:16px; padding:14px; margin-bottom:10px; animation:fadeIn .3s ease forwards; }
.order-card.pending  { border-left:3px solid var(--gold); }
.order-card.approved { border-left:3px solid var(--green); }
.order-card.rejected { border-left:3px solid var(--red); }

.order-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.order-lot  { font-size:15px; color:#fff; font-weight:700; }
.order-meta { font-size:11px; color:var(--muted); margin-top:3px; }

.status-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; flex-shrink:0; }
.status-pending  { background:#1a1000; color:var(--gold); border:1px solid var(--gold); }
.status-approved { background:#0a200e; color:var(--green); border:1px solid var(--green); }
.status-rejected { background:#1a0808; color:var(--red); border:1px solid var(--red); }

.timeline { display:flex; flex-direction:column; gap:0; margin:10px 0; }
.tl-step { display:flex; gap:10px; align-items:flex-start; }
.tl-dot-col { display:flex; flex-direction:column; align-items:center; width:18px; flex-shrink:0; }
.tl-dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--border2); background:var(--bg); flex-shrink:0; margin-top:2px; }
.tl-dot.done  { background:var(--green); border-color:var(--green); }
.tl-dot.active { background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px #f5c63844; }
.tl-dot.fail  { background:var(--red); border-color:var(--red); }
.tl-line { width:2px; flex:1; background:var(--border); min-height:18px; }
.tl-line.done { background:var(--green); }
.tl-content { padding-bottom:14px; flex:1; }
.tl-label { font-size:13px; color:#ccc; font-weight:600; }
.tl-sub   { font-size:11px; color:var(--muted); margin-top:2px; }

.detail-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); }
.detail-row:last-child { border-bottom:none; }
.detail-key { font-size:12px; color:var(--muted); }
.detail-val { font-size:12px; color:#fff; font-weight:600; }

.empty-state { display:flex; flex-direction:column; align-items:center; gap:12px; padding:60px 20px; text-align:center; }
.empty-icon { font-size:52px; opacity:.5; }

/* Slip modal */
#slipModal { position:fixed; inset:0; background:#000c; z-index:999; display:none; align-items:center; justify-content:center; padding:20px; }
#slipModal.open { display:flex; }
#slipModal img { max-width:100%; max-height:80vh; border-radius:12px; border:2px solid var(--gold); }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar-back" href="Lucky Draw Home.html">←</a>
  <span class="topbar-title">MY ORDERS</span>
  <div style="width:36px;"></div>
</header>

<!-- FILTER CHIPS -->
<div class="filter-bar">
  <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-chip" data-filter="pending"  onclick="setFilter('pending',this)">⏳ Pending</button>
  <button class="filter-chip" data-filter="approved" onclick="setFilter('approved',this)">✓ Approved</button>
  <button class="filter-chip" data-filter="rejected" onclick="setFilter('rejected',this)">✕ Rejected</button>
</div>

<div style="height:10px;"></div>

<section>
  <div id="orderList"></div>
</section>

<!-- SLIP MODAL -->
<div id="slipModal" onclick="this.classList.remove('open')">
  <img id="slipModalImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="slip">
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='Lucky Draw Home.html'">
    <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
  </button>
  <button class="nav-item active" style="position:relative;">
    <span class="nav-icon">📋</span><span class="nav-label">My Orders</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">🏆</span><span class="nav-label">Rank</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">💬</span><span class="nav-label">LINE</span>
  </button>
</nav>

<script src="lucky-draw-data.js"></script>
<script>
let currentFilter = 'all';

function getSteps(order) {
  const steps = [
    { label: 'Order Submitted',   sub: order.timestamp ? new Date(order.timestamp).toLocaleString() : '',  done: true,   active: false },
    { label: 'Slip Uploaded',     sub: order.slipImage ? 'Receipt attached' : 'Awaiting upload',           done: !!order.slipImage, active: !order.slipImage && order.status==='pending' },
    { label: 'Admin Verification',sub: order.status==='pending' ? 'Waiting for admin...' : order.status==='approved' ? 'Payment confirmed ✓' : 'Rejected ✕', done: order.status!=='pending', active: order.status==='pending', fail: order.status==='rejected' },
    { label: 'Live Stream Reveal',sub: order.status==='approved' ? 'Watch the stream for your card!' : 'After payment confirmed', done: false, active: order.status==='approved' },
    { label: 'Card Shipped',      sub: order.shippingCode ? 'Tracking: ' + order.shippingCode : 'After stream reveal',   done: !!order.shippingCode, active: false },
  ];
  return steps;
}

function renderOrders() {
  const all = LD.getOrders();
  const filtered = currentFilter === 'all' ? all : all.filter(o => o.status === currentFilter);
  const list = document.getElementById('orderList');

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎴</div>
        <div style="font-family:var(--font-jp);font-size:16px;color:var(--gold);">No orders yet</div>
        <div style="font-size:13px;color:var(--muted);">${currentFilter==='all'?'Join a draw and pick your lucky slot!':'No '+currentFilter+' orders found.'}</div>
        <button class="btn-gold" style="width:auto;padding:12px 24px;" onclick="location.href='Lucky Draw Home.html'">Browse Draws</button>
      </div>`;
    return;
  }

  list.innerHTML = '';
  filtered.forEach(order => {
    const steps = getSteps(order);
    const statusClass = `status-${order.status}`;
    const statusIcon  = order.status === 'pending' ? '⏳' : order.status === 'approved' ? '✓' : '✕';
    const statusLabel = order.status === 'pending' ? 'Pending Verification' : order.status === 'approved' ? 'Approved' : 'Rejected';

    list.innerHTML += `
      <div class="order-card ${order.status}">
        <!-- Header -->
        <div class="order-top">
          <div>
            <div class="order-lot">${order.lotName || 'Lucky Draw'}</div>
            <div class="order-meta">${order.series || ''} · Slot ${(order.slots||[]).join(', ')}</div>
          </div>
          <div class="${statusClass} status-badge">${statusIcon} ${statusLabel}</div>
        </div>

        <!-- Detail rows -->
        <div style="background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
          <div class="detail-row">
            <span class="detail-key">Order ID</span>
            <span class="detail-val" style="font-family:var(--font-jp);font-size:11px;color:var(--muted);">${order.id}</span>
          </div>
          <div class="detail-row">
            <span class="detail-key">Slot(s)</span>
            <span class="detail-val" style="color:var(--gold);">No. ${(order.slots||[]).join(', ')}</span>
          </div>
          <div class="detail-row">
            <span class="detail-key">Amount Paid</span>
            <span class="detail-val" style="color:var(--gold);font-family:var(--font-jp);">฿${(order.total||0).toLocaleString()}</span>
          </div>
          ${order.shippingCode ? `
          <div class="detail-row">
            <span class="detail-key">Tracking</span>
            <span class="detail-val" style="color:var(--blue);">${order.shippingCode}</span>
          </div>` : ''}
        </div>

        <!-- Timeline -->
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:1px;">ORDER TIMELINE</div>
        <div class="timeline">
          ${steps.map((s, i) => `
            <div class="tl-step">
              <div class="tl-dot-col">
                <div class="tl-dot ${s.fail ? 'fail' : s.done ? 'done' : s.active ? 'active' : ''}"></div>
                ${i < steps.length-1 ? `<div class="tl-line ${s.done ? 'done' : ''}"></div>` : ''}
              </div>
              <div class="tl-content">
                <div class="tl-label" style="color:${s.fail ? 'var(--red)' : s.done ? '#fff' : s.active ? 'var(--gold)' : 'var(--muted)'};">${s.label}</div>
                <div class="tl-sub">${s.sub}</div>
              </div>
            </div>`).join('')}
        </div>

        ${order.slipImage ? `
        <div style="margin-top:4px;">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;">PAYMENT SLIP</div>
          <img src="${order.slipImage}" style="width:100%;max-height:120px;object-fit:contain;border-radius:8px;border:1px solid var(--border2);cursor:pointer;" onclick="openSlip('${order.slipImage}')">
        </div>` : ''}

        ${order.status === 'rejected' ? `
        <button class="btn-gold" style="margin-top:12px;" onclick="location.href='Lucky Draw Lot Detail.html'">Try Again →</button>` : ''}
        ${order.status === 'approved' && !order.shippingCode ? `
        <div style="margin-top:10px;background:#0a1a10;border:1px dashed #3ecf7a44;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--green);">
          📺 Watch the live stream for your card reveal!
        </div>` : ''}
      </div>`;
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function openSlip(src) {
  document.getElementById('slipModalImg').src = src;
  document.getElementById('slipModal').classList.add('open');
}

renderOrders();
</script>
</body>
</html>

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy website and LIFF Workers
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    defaults:
      run:
        working-directory: Website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare configuration
        run: npm run verify:cloudflare

      - name: Deploy website Worker
        run: npm run cf:deploy:website

      - name: Deploy LIFF Worker
        run: npm run cf:deploy:liff
